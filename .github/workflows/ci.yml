name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.17"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: make check integration
      - run: make sbom
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-sbom
          path: sbom.json
          if-no-files-found: warn

