[project]
name = "adaptive-llm-platform"
version = "0.1.0"
description = "Governed LLM specialisation platform: observable baseline"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.10,<3",
  "opentelemetry-api>=1.30,<2",
  "cryptography>=50,<51",
]

[project.optional-dependencies]
training = ["torch>=2.6,<3", "transformers>=4.50,<5", "peft>=0.15,<1", "safetensors>=0.5,<1"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "mypy>=1.15,<2", "pip-audit>=2.8,<3", "httpx>=0.28,<1"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adaptive_llm"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "load: bounded local load and failure drills",
  "accelerator: GPU training tests, skipped without an accelerator",
  "accelerator_free: needs the optional training group but no accelerator",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["adaptive_llm"]
